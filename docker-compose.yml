# Infraestrutura local do fluxo principal: só o Banco relacional.
# Anexos, backup e repositório de backup (ADR 05) ficam fora desta prova de conceito.
services:
  postgres:
    image: postgres:17
    container_name: personalhealth-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: personalhealth
    ports:
      - "5432:5432"
    volumes:
      - personalhealth-db-data:/var/lib/postgresql/data

volumes:
  personalhealth-db-data:
